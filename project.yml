name: NazCast
options:
  bundleIdPrefix: com.matthewnazarian
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
configFiles:
  # Your Team ID lives here (copy Local.xcconfig.example). Kept out of git.
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  NazCast:
    type: application
    platform: iOS
    sources:
      - MafooCast
      # Liquid Glass app icon made in Icon Composer's format; it's a folder bundle, not a group.
      - path: Icon/NazCast.icon
        type: file
        buildPhase: resources
    settings:
      base:
        # Kept from the app's first name so existing installs (and their collections) update in place.
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewnazarian.MafooCast
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: NazCast
    info:
      path: MafooCast/Info.plist
      properties:
        CFBundleDisplayName: NazCast
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: NazCast shows your photos and videos so you can put them on your TV.
        NSLocalNetworkUsageDescription: NazCast looks for TVs on your Wi-Fi and streams your photos and videos to them.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
